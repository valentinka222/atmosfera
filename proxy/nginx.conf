# Куда передавать запросы. backend и frontend — это имена контейнеров:
# внутри сети Docker они работают как имена хостов
upstream backend_app {
    server backend:8080;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Запросы к API — в Spring Boot
    location /api/ {
        proxy_pass http://backend_app;

        # Передаём бэкенду сведения об исходном запросе
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное (страницы, css, js) — во фронтенд
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}
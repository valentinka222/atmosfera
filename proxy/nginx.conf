server {
    listen 80;
    server_name _;

    # Встроенный DNS-сервер Docker. Адреса сервисов ищем в момент
    # запроса, а не при запуске nginx: прокси стартует, даже если
    # бэкенд ещё не готов (важно для Swarm, где нет depends_on).
    # valid=10s — перепроверять адрес каждые 10 секунд
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Запросы к API — в Spring Boot
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — во фронтенд
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
spring:
  application:
    name: atmosfera
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atmosfera}
    username: ${DB_USER:atmosfera}
    password: ${DB_PASSWORD:atmosfera}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: "${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/testdata}"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Ограничиваем ожидание почтового сервера: если он недоступен,
    # запрос на запись не должен «висеть» — письмо просто не уйдёт
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Почта не критична для работы приложения: без неё запись работает,
    # письмо просто не отправится. Не учитываем её в проверке здоровья
    mail:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost}
  mail:
    from: ${MAIL_FROM:noreply@atmosfera.local}
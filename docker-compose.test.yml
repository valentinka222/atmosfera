# ===== Отличия тестового окружения =====
# Накладывается поверх docker-compose.yml

services:

  db:
    # Тестовая база одноразовая: вместо тома — папка в оперативной памяти.
    # После остановки контейнера данные исчезают, и каждый запуск
    # начинается с эталонного состояния, которое создаёт Flyway
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
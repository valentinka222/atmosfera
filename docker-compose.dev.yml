# ===== Отличия окружения разработки =====
# Накладывается поверх docker-compose.yml

services:

  db:
    # База открыта наружу, чтобы бэкенд из IntelliJ мог к ней подключиться
    ports:
      - "${DB_PUBLIC_PORT:-5433}:5432"

  mailpit:
    # SMTP-порт тоже открыт: бэкенд из IntelliJ отправляет письма на localhost:1025
    ports:
      - "1025:1025"
# ===== Окружение stage: развёртывание в кластере Docker Swarm =====
# Разворачивается командой: bash scripts/swarm.sh deploy <версия>
# Swarm не собирает образы — они берутся из локального registry

version: "3.9"

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atmosfera_stage
      POSTGRES_USER: atmosfera
      POSTGRES_PASSWORD: atmosfera_stage
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mailpit:
    image: axllent/mailpit:latest
    environment:
      # Не делать обратный DNS-запрос по IP клиента: в overlay-сети Swarm
      # он не получает ответа и задерживает приветствие SMTP
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "8027:8025"
    networks:
      - backend-net
    deploy:
      replicas: 1

  backend:
    image: localhost:5000/atmosfera-backend:${VERSION:-1.0}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: atmosfera_stage
      DB_USER: atmosfera
      DB_PASSWORD: atmosfera_stage
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_BASE_URL: http://localhost:8100
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/testdata
      TZ: Europe/Moscow
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512M

  frontend:
    image: localhost:5000/atmosfera-frontend:${VERSION:-1.0}
    networks:
      - frontend-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  proxy:
    image: localhost:5000/atmosfera-proxy:${VERSION:-1.0}
    ports:
      - "8100:80"
    networks:
      - frontend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  db-data:

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay